                }

            };

            const response = {
              grouped: true,
              groups: groupedLogs,
              summary

              type: 'groupLogsResult',
              data: response
            });
          } catch (error) {
            // 发送错误回主线程

              type: 'error',
              error: error instanceof Error ? error.message : 'Unknown error occurred'
            });
          }
        }
      };
